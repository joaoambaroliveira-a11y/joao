<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Clientes</title>
    <style>
        /* CSS UNIFICADO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        h2, h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        input:focus {
            border-color: #4A90E2;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .input-group {
            flex: 1;
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-enviar:hover {
            background-color: #218838;
        }

        /* Estilos da Tabela e Busca */
        .lista-container {
            max-width: 900px;
        }

        #busca {
            margin-bottom: 20px;
            border: 2px solid #4A90E2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
        }

        .acoes {
            display: flex;
            gap: 5px;
        }

        .btn-editar {
            background-color: #ffc107;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-excluir {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <form id="form-cadastro">
            <h2>Cadastro de Cliente</h2>
            <input type="hidden" id="index-cliente" value="">
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Ex: Maria Oliveira">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="maria@email.com">
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>
            </div>

            <button type="submit" class="btn-enviar" id="btn-acao">Cadastrar Cliente</button>
        </form>
    </div>

    <div class="container lista-container">
        <h3>Lista de Clientes</h3>
        <input type="text" id="busca" placeholder="Filtrar por nome..." onkeyup="filtrarClientes()">
        
        <table id="tabela-clientes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        /* JAVASCRIPT UNIFICADO */
        const form = document.getElementById('form-cadastro');
        const tabelaBody = document.querySelector('#tabela-clientes tbody');
        const inputIndex = document.getElementById('index-cliente');
        const btnAcao = document.getElementById('btn-acao');

        // Função para carregar dados
        function renderizarTabela() {
            tabelaBody.innerHTML = '';
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];

            clientes.forEach((cliente, index) => {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td>${cliente.nome}</td>
                    <td>${cliente.email}</td>
                    <td class="acoes">
                        <button class="btn-editar" onclick="prepararEdicao(${index})">Editar</button>
                        <button class="btn-excluir" onclick="removerCliente(${index})">Excluir</button>
                    </td>
                `;
                tabelaBody.appendChild(linha);
            });
        }

        // Adicionar ou Editar
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const clienteDados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                cpf: document.getElementById('cpf').value
            };

            let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            const index = inputIndex.value;

            if (index === "") {
                clientes.push(clienteDados);
            } else {
                clientes[index] = clienteDados;
                inputIndex.value = "";
                btnAcao.textContent = "Cadastrar Cliente";
                btnAcao.style.backgroundColor = "#28a745";
            }

            localStorage.setItem('clientes', JSON.stringify(clientes));
            form.reset();
            renderizarTabela();
        });

        // Preparar Edição
        window.prepararEdicao = function(index) {
            const clientes = JSON.parse(localStorage.getItem('clientes'));
            const c = clientes[index];

            document.getElementById('nome').value = c.nome;
            document.getElementById('email').value = c.email;
            document.getElementById('telefone').value = c.telefone;
            document.getElementById('cpf').value = c.cpf;
            
            inputIndex.value = index;
            btnAcao.textContent = "Salvar Alterações";
            btnAcao.style.backgroundColor = "#ffc107";
            window.scrollTo(0, 0);
        };

        // Remover
        window.removerCliente = function(index) {
            if(confirm("Deseja realmente excluir este cliente?")) {
                let clientes = JSON.parse(localStorage.getItem('clientes'));
                clientes.splice(index, 1);
                localStorage.setItem('clientes', JSON.stringify(clientes));
                renderizarTabela();
            }
        };

        // Filtro de Busca
        window.filtrarClientes = function() {
            const termo = document.getElementById('busca').value.toLowerCase();
            const linhas = tabelaBody.getElementsByTagName('tr');

            for (let linha of linhas) {
                const nome = linha.cells[0].textContent.toLowerCase();
                linha.style.display = nome.includes(termo) ? "" : "none";
            }
        };

        // Inicialização
        renderizarTabela();
    </script>
</body>
</html>
