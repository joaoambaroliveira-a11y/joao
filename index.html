<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Chute ao Gol Profissional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#0b5e2f, #083d1f);
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 {
            margin: 10px;
            text-shadow: 0 0 15px #ffeb3b;
        }
        #game {
            width: 880px;
            height: 520px;
            background: #0a7a45 url('https://images.unsplash.com/photo-1622473596133-8b0c5a7c5c2b') center/cover;
            margin: 15px auto;
            position: relative;
            border: 12px solid #052b17;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #goal-image {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            height: 280px;
            background: url('https://i.ibb.co/0jZ7v7Y/soccer-goal-professional.png') no-repeat center/contain;
            z-index: 5;
            pointer-events: none;
        }
        #goalkeeper {
            position: absolute;
            font-size: 110px;
            top: 125px;
            transition: left 0.3s ease;
            z-index: 10;
        }
        #ball {
            position: absolute;
            font-size: 48px;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
            user-select: none;
            z-index: 15;
        }
        #power-bar {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 20px;
            background: #333;
            border: 3px solid white;
            border-radius: 10px;
            overflow: hidden;
        }
        #power {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
        }
        .info {
            font-size: 26px;
            margin: 12px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 20px black;
            display: none;
            z-index: 100;
        }
        button {
            padding: 12px 26px;
            margin: 10px;
            font-size: 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>⚽ CHUTE AO GOL PROFISSIONAL ⚽</h1>
    <div class="info">
        Pênaltis: <strong id="penalties">0 / 5</strong> | 
        Gols: <strong id="score">0</strong>
    </div>

    <div id="game">
        <div id="goal-image"></div>
        <div id="goalkeeper">🧤</div>
        <div id="ball">⚽</div>
        <div id="power-bar"><div id="power"></div></div>
        <div id="message"></div>
    </div>

    <button onclick="resetGame()">🔄 Novo Jogo (5 Pênaltis)</button>

    <script>
        let score = 0;
        let penalties = 0;
        let isDragging = false;
        let startX, startY;
        let gameActive = true;

        const ball = document.getElementById('ball');
        const goalkeeper = document.getElementById('goalkeeper');
        const message = document.getElementById('message');
        const scoreEl = document.getElementById('score');
        const penaltiesEl = document.getElementById('penalties');
        const powerBar = document.getElementById('power');

        function moveGoalkeeper() {
            const rand = Math.random();
            if (rand < 0.33) goalkeeper.style.left = '24%';
            else if (rand < 0.66) goalkeeper.style.left = '48%';
            else goalkeeper.style.left = '72%';
        }

        function kickBall(dx, dy) {
            if (!gameActive) return;
            gameActive = false;
            penalties++;
            penaltiesEl.textContent = `${penalties} / 5`;

            const powerLevel = Math.min(Math.sqrt(dx*dx + dy*dy) / 3.2, 100);
            powerBar.style.width = powerLevel + '%';

            const distance = Math.min(powerLevel * 2.9, 410);
            const angle = Math.atan2(dy, dx);

            const endX = Math.cos(angle) * distance;
            const endY = -Math.abs(Math.sin(angle) * distance) - 130;

            ball.style.transition = 'transform 1.1s cubic-bezier(0.25, 0.1, 0.25, 1)';
            ball.style.transform = `translate(${endX}px, ${endY}px)`;

            moveGoalkeeper();

            setTimeout(() => {
                const gkPos = goalkeeper.style.left;
                let isGoal = powerLevel > 48;

                if (gkPos.includes('24%') && endX < -70) isGoal = false;
                if (gkPos.includes('72%') && endX > 70) isGoal = false;
                if (gkPos.includes('48%') && Math.abs(endX) < 85 && Math.random() < 0.65) isGoal = false;

                if (isGoal) {
                    score++;
                    scoreEl.textContent = score;
                    message.textContent = "🥅 GOOOOL!!!";
                    message.style.color = "#4caf50";
                } else {
                    message.textContent = "🧤 DEFENDEU!";
                    message.style.color = "#ff9800";
                }

                message.style.display = 'block';

                setTimeout(() => {
                    if (penalties >= 5) {
                        alert(`🏁 Fim de jogo!\nVocê fez ${score} gols de 5 pênaltis!`);
                        resetGame();
                    } else {
                        resetPositions();
                    }
                }, 1600);
            }, 1100);
        }

        ball.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            ball.style.cursor = 'grabbing';
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            ball.style.cursor = 'grab';

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
                kickBall(dx, dy);
            } else {
                powerBar.style.width = '0%';
            }
        });

        function resetPositions() {
            ball.style.transition = 'none';
            ball.style.transform = 'translateX(-50%)';
            goalkeeper.style.left = '48%';
            message.style.display = 'none';
            powerBar.style.width = '0%';
            gameActive = true;
        }

        function resetGame() {
            score = 0;
            penalties = 0;
            scoreEl.textContent = 0;
            penaltiesEl.textContent = '0 / 5';
            resetPositions();
        }

        window.onload = () => {
            goalkeeper.style.left = '48%';
        };
    </script>
</body>
</html>
