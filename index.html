<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acesso ao Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: #4a90e2; }
        button {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #357abd; }
        .error { color: red; font-size: 0.8rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Painel ADM</h2>
        <p id="msg-erro" class="error">Usuário ou senha inválidos!</p>
        <form id="login-form">
            <input type="text" id="user" placeholder="Usuário (admin)" required>
            <input type="password" id="pass" placeholder="Senha (123)" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const s = document.getElementById('pass').value;

            // Simulação de login
            if (u === "admin" && s === "123") {
                // REDIRECIONA PARA A TELA DE CADASTRO
                window.location.href = "cadastro.html";
            } else {
                document.getElementById('msg-erro').style.display = "block";
            }
        });
    </script>
</body>
</html>
