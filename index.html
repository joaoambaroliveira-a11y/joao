<!DOCTYPE html>
<!-- index.html - Calculadora de IMC com design tecnológico -->

<!-- Tag raiz do documento HTML -->
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres (suporte a acentos) -->
    <meta charset="UTF-8">
    
    <!-- Configuração para responsividade em celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece na aba do navegador -->
    <title>IMC TECH</title>
    
    <!-- Link para o arquivo de estilos externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Container principal da aplicação -->
    <div class="container">
        
        <!-- Título principal com estilo neon -->
        <h1>IMC <span>TECH</span></h1>
        
        <!-- Formulário de entrada de dados -->
        <form id="imcForm">
            
            <!-- Grupo do peso -->
            <div class="input-group">
                <!-- Label do campo peso -->
                <label for="peso">PESO (KG)</label>
                <!-- Campo de entrada para peso -->
                <input type="number" id="peso" step="0.01" placeholder="70.5" required>
            </div>
            
            <!-- Grupo da altura -->
            <div class="input-group">
                <!-- Label do campo altura -->
                <label for="altura">ALTURA (METROS)</label>
                <!-- Campo de entrada para altura -->
                <input type="number" id="altura" step="0.01" placeholder="1.75" required>
            </div>
            
            <!-- Botão de calcular -->
            <button type="submit">CALCULAR IMC</button>
        </form>
        
        <!-- Área onde o resultado será exibido dinamicamente -->
        <div id="resultado"></div>
        
    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
