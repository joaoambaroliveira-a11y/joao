<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fundo Azul Ensolarado</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      /* Gradiente de azul para simular céu */
      background: linear-gradient(to top, #87CEEB, #00BFFF);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .sol {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, #FFD700 40%, #FFA500 100%);
      border-radius: 50%;
      box-shadow: 0 0 60px #FFD700;
    }
  </style>
</head>
<body>
  <div class="sol"></div>
</body>
</html>
