<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Chute ao Gol - Modo Avançado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#0b5e2f, #083d1f);
            color: white;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 {
            margin: 10px;
            text-shadow: 0 0 15px #ffeb3b;
        }
        #game {
            width: 850px;
            height: 480px;
            background: #0f8f4a;
            margin: 15px auto;
            position: relative;
            border: 10px solid #052b17;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #goal {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 460px;
            height: 240px;
            border: 14px solid white;
            border-top: none;
        }
        #goalkeeper {
            position: absolute;
            font-size: 90px;
            top: 130px;
            transition: left 0.25s;
        }
        #ball {
            position: absolute;
            font-size: 48px;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
            user-select: none;
            transition: none;
        }
        #power-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 18px;
            background: #333;
            border: 3px solid white;
            border-radius: 10px;
            overflow: hidden;
        }
        #power {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
            transition: width 0.05s;
        }
        .info {
            font-size: 26px;
            margin: 12px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px black;
            display: none;
            z-index: 100;
        }
        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>⚽ CHUTE AO GOL ⚽</h1>
    <div class="info">
        Pênaltis: <strong id="penalties">0 / 5</strong> | 
        Gols: <strong id="score">0</strong>
    </div>

    <div id="game">
        <div id="goal"></div>
        <div id="goalkeeper">🥅</div>
        <div id="ball">⚽</div>
        <div id="power-bar"><div id="power"></div></div>
        <div id="message"></div>
    </div>

    <button onclick="resetGame()">🔄 Novo Jogo (5 Pênaltis)</button>

    <script>
        let score = 0;
        let penalties = 0;
        let isDragging = false;
        let startX, startY;
        let power = 0;
        let gameActive = true;

        const ball = document.getElementById('ball');
        const goalkeeper = document.getElementById('goalkeeper');
        const message = document.getElementById('message');
        const scoreEl = document.getElementById('score');
        const penaltiesEl = document.getElementById('penalties');
        const powerBar = document.getElementById('power');

        // Posições do goleiro
        function moveGoalkeeper() {
            const pos = Math.random();
            if (pos < 0.35) goalkeeper.style.left = '25%';      // esquerda
            else if (pos < 0.65) goalkeeper.style.left = '48%'; // meio
            else goalkeeper.style.left = '71%';                 // direita
        }

        function kickBall(dx, dy) {
            if (!gameActive) return;
            gameActive = false;
            penalties++;
            penaltiesEl.textContent = `${penalties} / 5`;

            const powerLevel = Math.min(Math.sqrt(dx*dx + dy*dy) / 3, 100);
            powerBar.style.width = powerLevel + '%';

            // Animação da bola
            const distance = Math.min(powerLevel * 2.8, 380);
            const angle = Math.atan2(dy, dx);

            const endX = Math.cos(angle) * distance;
            const endY = -Math.abs(Math.sin(angle) * distance) - 100;

            ball.style.transition = 'transform 1.1s cubic-bezier(0.25, 0.1, 0.25, 1)';
            ball.style.transform = `translate(${endX}px, ${endY}px)`;

            moveGoalkeeper();

            setTimeout(() => {
                const saved = goalkeeper.style.left;
                const goalChance = powerLevel > 65 ? 0.85 : 0.65;

                if (Math.random() < goalChance && 
                    (saved.includes('25%') && endX > -80 || 
                     saved.includes('71%') && endX < 80 || 
                     saved.includes('48%'))) {
                    
                    score++;
                    scoreEl.textContent = score;
                    message.textContent = "🥅 GOOOOL!!!";
                    message.style.color = "#4caf50";
                } else {
                    message.textContent = "🧤 DEFENDEU!";
                    message.style.color = "#ff9800";
                }

                message.style.display = 'block';

                setTimeout(() => {
                    if (penalties >= 5) {
                        alert(`Fim de jogo! Você fez ${score} gols de 5 pênaltis!`);
                        resetGame();
                    } else {
                        resetPositions();
                    }
                }, 1600);
            }, 1100);
        }

        // Controles de mouse
        ball.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            ball.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const powerLevel = Math.min(Math.sqrt(dx*dx + dy*dy) / 3, 100);
            powerBar.style.width = powerLevel + '%';
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            ball.style.cursor = 'grab';

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                kickBall(dx, dy);
            } else {
                powerBar.style.width = '0%';
            }
        });

        function resetPositions() {
            ball.style.transition = 'none';
            ball.style.transform = 'translateX(-50%)';
            goalkeeper.style.left = '48%';
            message.style.display = 'none';
            powerBar.style.width = '0%';
            gameActive = true;
        }

        function resetGame() {
            score = 0;
            penalties = 0;
            scoreEl.textContent = 0;
            penaltiesEl.textContent = '0 / 5';
            resetPositions();
        }

        // Iniciar
        window.onload = () => {
            goalkeeper.style.left = '48%';
        };
    </script>

</body>
</html>
