<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Estacionamento</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
        }

        /* Área do Jogo */
        #gameArea {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #444;
            border: 4px solid #fff;
            overflow: hidden;
        }

        /* Obstáculos / Paredes */
        .obstacle {
            position: absolute;
            background-color: #777;
            border: 2px solid #555;
        }

        /* Vaga de Estacionamento */
        #parkingSpot {
            position: absolute;
            width: 60px;
            height: 40px;
            left: 500px;
            top: 40px;
            background-color: rgba(255, 235, 59, 0.6);
            border: 2px dashed #fbc02d;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #fff;
        }

        /* O Carro */
        #car {
            position: absolute;
            width: 40px;
            height: 25px;
            background-color: #e53935;
            border-radius: 4px;
            left: 50px;
            top: 300px;
            transition: transform 0.1s;
        }

        /* Faróis do Carro */
        #car::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 3px;
            width: 4px;
            height: 4px;
            background-color: #fffde7;
            box-shadow: 0 15px 0 #fffde7;
        }

        /* Mensagem de Status */
        #message {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
        }

        p {
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Estacione o Carro!</h1>
    <div id="gameArea">
        <div id="parkingSpot">VAGA</div>
        
        <div class="obstacle" style="width: 200px; height: 40px; left: 0; top: 150px;"></div>
        <div class="obstacle" style="width: 200px; height: 40px; left: 400px; top: 150px;"></div>
        <div class="obstacle" style="width: 40px; height: 150px; left: 280px; top: 250px;"></div>

        <div id="car"></div>
    </div>

    <div id="message">Use as setas para dirigir!</div>
    <p>Evite as paredes cinzas e as bordas.</p>

    <script>
        const car = document.getElementById('car');
        const gameArea = document.getElementById('gameArea');
        const spot = document.getElementById('parkingSpot');
        const message = document.getElementById('message');
        const obstacles = document.querySelectorAll('.obstacle');

        // Posição inicial e física simples do carro
        let carX = 50;
        let carY = 300;
        let angle = 0;
        let speed = 0;
        
        const maxSpeed = 4;
        const turnSpeed = 5;

        // Controle de teclas pressionadas
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Função principal de atualização do jogo (Loop)
        function gameLoop() {
            // Acelerar / Dar ré
            if (keys['ArrowUp']) {
                speed = Math.min(speed + 0.2, maxSpeed);
            } else if (keys['ArrowDown']) {
                speed = Math.max(speed - 0.2, -maxSpeed * 0.6);
            } else {
                speed *= 0.9; // Desaceleração gradual (atrito)
            }

            // Virar para os lados (só vira se o carro estiver se movendo)
            if (Math.abs(speed) > 0.2) {
                const direction = speed > 0 ? 1 : -1;
                if (keys['ArrowLeft']) angle -= turnSpeed * direction;
                if (keys['ArrowRight']) angle += turnSpeed * direction;
            }

            // Calcular próxima posição baseada no ângulo matemático
            const radians = angle * (Math.PI / 180);
            carX += speed * Math.cos(radians);
            carY += speed * Math.sin(radians);

            // Aplicar posição e rotação visualmente
            car.style.left = carX + 'px';
            car.style.top = carY + 'px';
            car.style.transform = `rotate(${angle}deg)`;

            checarColisoes();

            requestAnimationFrame(gameLoop);
        }

        // Função para detectar colisões
        function checarColisoes() {
            const carRect = car.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            const spotRect = spot.getBoundingClientRect();

            // 1. Colisão com as bordas do cenário
            if (carRect.left < areaRect.left || carRect.right > areaRect.right ||
                carRect.top < areaRect.top || carRect.bottom > areaRect.bottom) {
                resetarCarro("Você bateu na borda!");
                return;
            }

            // 2. Colisão com os obstáculos cinzas
            obstacles.forEach(obs => {
                const obsRect = obs.getBoundingClientRect();
                if (!(carRect.right < obsRect.left || 
                      carRect.left > obsRect.right || 
                      carRect.bottom < obsRect.top || 
                      carRect.top > obsRect.bottom)) {
                    resetarCarro("Você bateu no obstáculo!");
                }
            });

            // 3. Checar se conseguiu estacionar na vaga
            if (!(carRect.right < spotRect.left || 
                  carRect.left > spotRect.right || 
                  carRect.bottom < spotRect.top || 
                  carRect.top > spotRect.bottom)) {
                message.innerText = "Parabéns! Você estacionou perfeitamente! 🎉";
                message.style.color = "#4caf50";
                speed = 0;
            }
        }

        // Reseta a posição do carro se bater
        function resetarCarro(texto) {
            message.innerText = texto + " Tente novamente.";
            message.style.color = "#e53935";
            carX = 50;
            carY = 300;
            angle = 0;
            speed = 0;
        }

        // Inicia o jogo
        gameLoop();
    </script>
</body>
</html>
