<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐅 JOGO DO TIGRÃO 🐅</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #0f0c0a, #3a1f0f);
        color: #ffd700;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: #1a1108;
        border: 8px solid #d4a017;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(212, 160, 23, 0.8);
        position: relative;
    }

    .header {
        background: linear-gradient(#b8860b, #8b5a00);
        padding: 20px;
        text-align: center;
        border-bottom: 5px solid #ffd700;
    }

    .header h1 {
        font-size: 32px;
        text-shadow: 0 0 15px #ff4500;
    }

    .reels {
        background: #000;
        padding: 25px 20px;
        display: flex;
        justify-content: center;
        gap: 15px;
        border-bottom: 5px solid #d4a017;
    }

    .reel {
        width: 95px;
        height: 115px;
        background: #111;
        border: 5px solid #ffd700;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 58px;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }

    .info {
        padding: 15px 20px;
        background: #2a1a0f;
        text-align: center;
    }

    .balance, .bet {
        font-size: 19px;
        margin: 10px 0;
        font-weight: bold;
    }

    .balance span, .bet span {
        color: #00ff88;
    }

    .controls {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .btn {
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .spin-btn {
        background: linear-gradient(#ff4500, #cc3700);
        color: white;
        font-size: 24px;
        padding: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .bet-controls {
        display: flex;
        gap: 10px;
    }

    .bet-btn {
        background: #444;
        color: #ffd700;
        flex: 1;
        font-size: 20px;
    }

    .result {
        text-align: center;
        font-size: 24px;
        min-height: 40px;
        margin-top: 10px;
        font-weight: bold;
    }

    /* Animações */
    .spinning {
        animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotateX(0deg); }
        100% { transform: rotateX(360deg); }
    }

    /* Confetes */
    .confetti {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 200;
    }

    /* Cartinha */
    .cartinha {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: linear-gradient(#fff, #f8e8c0);
        color: #000;
        width: 280px;
        padding: 25px;
        border: 5px solid #d4a017;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        text-align: center;
        z-index: 300;
        animation: soltarCartinha 4.5s forwards;
    }

    .cartinha h2 {
        color: #b8860b;
        font-size: 24px;
    }

    .cartinha .premio {
        font-size: 32px;
        font-weight: bold;
        color: #00aa00;
        margin: 15px 0;
    }

    @keyframes soltarCartinha {
        0% { transform: translate(-50%, -120%) scale(0.2); opacity: 0; }
        25% { transform: translate(-50%, -50%) scale(1.15); }
        45% { transform: translate(-50%, -50%) scale(0.95); }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .win-flash {
        animation: winFlash 0.6s 3;
    }

    @keyframes winFlash {
        0%, 100% { background: #000; }
        50% { background: #00ff00; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🐅 JOGO DO TIGRÃO 🐅</h1>
    </div>

    <div class="reels">
      <div class="reel" id="reel1">🐅</div>
      <div class="reel" id="reel2">🍒</div>
      <div class="reel" id="reel3">⭐</div>
    </div>

    <div class="info">
      <div class="balance">Saldo: R$ <span id="saldo">500.00</span></div>
      <div class="bet">Aposta: R$ <span id="aposta">10.00</span></div>
    </div>

    <div class="controls">
      <div class="bet-controls">
        <button class="btn bet-btn" id="diminuir">− 10</button>
        <button class="btn bet-btn" id="aumentar">+ 10</button>
      </div>
      <button class="btn spin-btn" id="spinBtn">🌀 GIRAR O TIGRÃO 🌀</button>
      <div class="result" id="result"></div>
    </div>

    <div class="footer" style="text-align: center; padding: 12px; background: #0f0a05; font-size: 15px;">
      Banca da Casa: R$ <span id="banca">10000.00</span>
    </div>
  </div>

  <script>
    const emojis = ["🐅", "🍒", "⭐", "💎", "🔔", "🍋", "7️⃣", "🔥", "🌟", "💰"];

    let saldo = 500;
    let aposta = 10;
    let banca = 10000;

    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const reel3 = document.getElementById('reel3');
    const saldoEl = document.getElementById('saldo');
    const apostaEl = document.getElementById('aposta');
    const bancaEl = document.getElementById('banca');
    const resultEl = document.getElementById('result');
    const spinBtn = document.getElementById('spinBtn');
    const container = document.querySelector('.container');

    function atualizarTela() {
      saldoEl.textContent = saldo.toFixed(2);
      apostaEl.textContent = aposta.toFixed(2);
      bancaEl.textContent = banca.toFixed(2);
    }

    // Animação de Confetes
    function lancarConfetes() {
      const confettiContainer = document.createElement('div');
      confettiContainer.className = 'confetti';
      container.appendChild(confettiContainer);

      for (let i = 0; i < 80; i++) {
        const confete = document.createElement('div');
        confete.style.position = 'absolute';
        confete.style.width = '10px';
        confete.style.height = '10px';
        confete.style.borderRadius = '50%';
        confete.style.backgroundColor = ['#ffd700', '#ff4500', '#00ff00', '#00ffff', '#ff00ff'][Math.floor(Math.random()*5)];
        confete.style.left = Math.random() * 100 + '%';
        confete.style.top = '-10px';
        confete.style.opacity = Math.random() + 0.5;
        confete.style.transform = `rotate(${Math.random()*360}deg)`;
        
        confettiContainer.appendChild(confete);

        const duration = Math.random() * 3 + 2;
        confete.animate([
          { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
          { transform: `translateY(${window.innerHeight}px) rotate(${Math.random()*800}deg)`, opacity: 0 }
        ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
        });

        setTimeout(() => confete.remove(), duration * 1200);
      }

      setTimeout(() => confettiContainer.remove(), 5000);
    }

    function mostrarCartinha(ganho) {
      const cartinha = document.createElement('div');
      cartinha.className = 'cartinha';
      cartinha.innerHTML = `
        <h2>🎟️ TIGRAÇO PREMIADO 🎟️</h2>
        <p style="margin:8px 0;">Parabéns! Você ganhou</p>
        <div class="premio">R$ ${ganho}</div>
      `;
      container.appendChild(cartinha);

      setTimeout(() => {
        cartinha.style.opacity = '0';
        setTimeout(() => cartinha.remove(), 1000);
      }, 4200);
    }

    function girarRolos() {
      const reels = [reel1, reel2, reel3];
      reels.forEach(reel => reel.classList.add('spinning'));

      setTimeout(() => {
        const resultado = [
          emojis[Math.floor(Math.random() * emojis.length)],
          emojis[Math.floor(Math.random() * emojis.length)],
          emojis[Math.floor(Math.random() * emojis.length)]
        ];

        reel1.textContent = resultado[0];
        reel2.textContent = resultado[1];
        reel3.textContent = resultado[2];

        reels.forEach(reel => reel.classList.remove('spinning'));

        verificarResultado(resultado);
      }, 1600);
    }

    function verificarResultado(resultado) {
      const temTigrao = resultado.includes("🐅");
      
      if (temTigrao) {
        const ganho = Math.floor(Math.random() * 901) + 100;
        saldo += ganho;
        banca -= ganho;

        resultEl.innerHTML = `🎉 G A N H O U ! + R$ ${ganho}`;
        resultEl.classList.add('win');

        // Animações de vitória
        lancarConfetes();
        mostrarCartinha(ganho);

        if (aposta < 200) aposta += 10;
      } else {
        saldo -= aposta;
        banca += aposta;
        resultEl.textContent = "😢 Sem Tigrão...";
        resultEl.classList.remove('win');
      }

      atualizarTela();

      if (saldo < aposta) {
        setTimeout(() => alert("💸 Saldo insuficiente! Fim de jogo."), 800);
      }
    }

    // Eventos
    spinBtn.addEventListener('click', () => {
      if (saldo < aposta) {
        alert("Saldo insuficiente!");
        return;
      }
      resultEl.textContent = "";
      resultEl.classList.remove('win');
      girarRolos();
    });

    document.getElementById('aumentar').addEventListener('click', () => {
      if (aposta + 10 <= saldo) aposta += 10;
      atualizarTela();
    });

    document.getElementById('diminuir').addEventListener('click', () => {
      if (aposta > 10) aposta -= 10;
      atualizarTela();
    });

    atualizarTela();
  </script>
</body>
</html>
