<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Neon - Azul e Preto</title>
    <style>
        /* Configurações Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            /* Fundo radial que mistura o azul escuro com o preto */
            background: radial-gradient(circle at center, #001d3d 0%, #000814 100%);
            background-attachment: fixed;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Menu de Navegação */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10% ;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px); /* Efeito de vidro */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00b4d8;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #caf0f8;
            transition: 0.3s;
            font-weight: 500;
        }

        nav ul li a:hover {
            color: #00b4d8;
            text-shadow: 0 0 8px #00b4d8;
        }

        /* Conteúdo Central */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #caf0f8, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #90e0ef;
            max-width: 600px;
        }

        /* Botão Neon */
        .btn-neon {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #00b4d8;
            background: transparent;
            border: 2px solid #00b4d8;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.5s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-neon:hover {
            background: #00b4d8;
            color: #000;
            box-shadow: 0 0 20px #00b4d8, 0 0 60px #00b4d8;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TECH_BLUE</div>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Projetos</a></li>
            <li><a href="#">Serviços</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1>Bem-vindo ao Futuro</h1>
        <p>Explore a elegância do contraste entre o azul profundo e a escuridão do preto com design moderno.</p>
        
        <button class="btn-neon">Começar Agora</button>
    </div>

</body>
</html>
