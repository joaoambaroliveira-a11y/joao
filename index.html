<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .produto-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
            padding: 15px;
            text-align: center;
        }
        .produto-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        .produto-card h3 {
            color: #555;
            font-size: 1.1rem;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <h1>Produtos da Cesta Básica</h1>

    <div class="container">
        <div class="produto-card">
            <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400" alt="Arroz">
            <h3>Arroz</h3>
        </div>

        <div class="produto-card">
            <img src="https://images.unsplash.com/photo-1551462147-ff29053bfc14?w=400" alt="Feijão">
            <h3>Feijão</h3>
        </div>

        <div class="produto-card">
            <img src="https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400" alt="Óleo de Soja">
            <h3>Óleo de Soja</h3>
        </div>

        <div class="produto-card">
            <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400" alt="Café">
            <h3>Café</h3>
        </div>

        <div class="produto-card">
            <img src="https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400" alt="Leite">
            <h3>Leite</h3>
        </div>
    </div>

</body>
</html>
