<!DOCTYPE html>
<!-- index.html - Calculadora de IMC Tech (Altura em CM + Tabela) -->

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC TECH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>IMC <span>TECH</span></h1>
        
        <form id="imcForm">
            <div class="input-group">
                <label for="peso">PESO (KG)</label>
                <input type="number" id="peso" step="0.1" placeholder="70.5" required>
            </div>
            
            <div class="input-group">
                <!-- Alterado para centímetros -->
                <label for="altura">ALTURA (CM)</label>
                <input type="number" id="altura" step="0.1" placeholder="175" required>
            </div>
            
            <button type="submit">CALCULAR IMC</button>
        </form>
        
        <!-- Área do resultado -->
        <div id="resultado"></div>

        <!-- Tabela de classificação de IMC -->
        <div class="tabela-imc">
            <h2>Tabela de Classificação IMC</h2>
            <table>
                <thead>
                    <tr>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Abaixo de 18.5</td><td>Abaixo do peso</td></tr>
                    <tr><td>18.5 – 24.9</td><td>Peso normal</td></tr>
                    <tr><td>25.0 – 29.9</td><td>Sobrepeso</td></tr>
                    <tr><td>30.0 – 34.9</td><td>Obesidade Grau I</td></tr>
                    <tr><td>35.0 – 39.9</td><td>Obesidade Grau II</td></tr>
                    <tr><td>40.0 ou mais</td><td>Obesidade Grau III</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
