<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pasto com Animais</title>
  <style>
    body {
      background-color: #7CFC00; /* cor de pasto */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .pasto {
      width: 80%;
      height: 60%;
      background-color: #228B22;
      position: relative;
      border: 3px solid #006400;
    }
    .animal {
      width: 100px;
      position: absolute;
    }
    .vaca { top: 20px; left: 30px; }
    .cavalo { top: 100px; left: 200px; }
    .ovelha { top: 200px; left: 400px; }
  </style>
</head>
<body>
  <div class="pasto">
    <img src="https://example.com/vaca.png" alt="Vaca" class="animal vaca">
    <img src="https://example.com/cavalo.png" alt="Cavalo" class="animal cavalo">
    <img src="https://example.com/ovelha.png" alt="Ovelha" class="animal ovelha">
  </div>
</body>
</html>
