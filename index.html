<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥊 BOXING ARENA - 2 Jogadores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: #ff4444;
            text-shadow: 0 0 15px #ff0000;
            margin: 15px;
        }
        #arena {
            width: 820px;
            height: 420px;
            background: linear-gradient(#1a1a1a, #333);
            margin: 20px auto;
            position: relative;
            border: 10px solid #550000;
            border-radius: 15px;
            overflow: hidden;
        }
        .fighter {
            position: absolute;
            font-size: 95px;
            bottom: 50px;
            transition: all 0.2s;
        }
        #player1 { left: 110px; }
        #player2 { right: 110px; transform: scaleX(-1); }

        .health-bar {
            height: 32px;
            background: #222;
            width: 340px;
            margin: 10px auto;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        .health {
            height: 100%;
            transition: width 0.4s;
        }
        #p1-health-bar .health { background: linear-gradient(#2196f3, #03a9f4); }
        #p2-health-bar .health { background: linear-gradient(#f44336, #ff5722); }

        #controls {
            margin: 20px;
            font-size: 1.1em;
        }
        #message {
            font-size: 42px;
            margin: 20px;
            font-weight: bold;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <h1>🥊 BOXING ARENA - 2 JOGADORES 🥊</h1>

    <div class="health-bar" id="p1-health-bar">
        <div class="health" id="p1-health"></div>
        <strong>🔵 BOXEAODR AZUL</strong>
    </div>

    <div id="arena">
        <div id="player1" class="fighter">🥊</div>
        <div id="player2" class="fighter">🥊</div>
    </div>

    <div class="health-bar" id="p2-health-bar">
        <div class="health" id="p2-health"></div>
        <strong>🔴 BOXEAODR VERMELHO</strong>
    </div>

    <div id="controls">
        <p><strong>Jogador 1 (Azul):</strong> A = Soco | S = Chute | D = Uppercut | F = Defender</p>
        <p><strong>Jogador 2 (Vermelho):</strong> J = Soco | K = Chute | L = Uppercut | ; = Defender</p>
        <button onclick="resetGame()">🔄 Novo Combate</button>
    </div>

    <div id="message"></div>

    <script>
        let p1HP = 100;
        let p2HP = 100;
        let gameOver = false;
        let p1Defending = false;
        let p2Defending = false;

        const p1HealthEl = document.getElementById('p1-health');
        const p2HealthEl = document.getElementById('p2-health');
        const messageEl = document.getElementById('message');
        const player1 = document.getElementById('player1');
        const player2 = document.getElementById('player2');

        function updateHealth() {
            p1HealthEl.style.width = p1HP + '%';
            p2HealthEl.style.width = p2HP + '%';
        }

        function attack(attacker, damage, isSpecial = false) {
            if (gameOver) return;

            if (attacker === 1) {
                p2HP -= damage;
                if (p2HP < 0) p2HP = 0;
                player1.style.transform = 'translateX(70px)';
                setTimeout(() => player1.style.transform = 'translateX(0)', 180);
                
                if (isSpecial) {
                    player1.textContent = '💥';
                    setTimeout(() => player1.textContent = '🥊', 450);
                }
            } else {
                p1HP -= damage;
                if (p1HP < 0) p1HP = 0;
                player2.style.transform = 'translateX(-70px)';
                setTimeout(() => player2.style.transform = 'translateX(0)', 180);
                
                if (isSpecial) {
                    player2.textContent = '💥';
                    setTimeout(() => player2.textContent = '🥊', 450);
                }
            }

            updateHealth();
            checkWin();
        }

        function defend(player) {
            if (gameOver) return;
            if (player === 1) p1Defending = true;
            else p2Defending = true;

            messageEl.textContent = `Jogador ${player} defendendo!`;
            
            setTimeout(() => {
                if (player === 1) p1Defending = false;
                else p2Defending = false;
                messageEl.textContent = '';
            }, 1100);
        }

        function checkWin() {
            if (p1HP <= 0) {
                gameOver = true;
                messageEl.innerHTML = "🏆 BOXEAODR VERMELHO VENCEU!";
                messageEl.style.color = "#ff4444";
            } else if (p2HP <= 0) {
                gameOver = true;
                messageEl.innerHTML = "🏆 BOXEAODR AZUL VENCEU!";
                messageEl.style.color = "#4caf50";
            }
        }

        function resetGame() {
            p1HP = 100;
            p2HP = 100;
            gameOver = false;
            p1Defending = false;
            p2Defending = false;
            messageEl.innerHTML = '';
            player1.textContent = '🥊';
            player2.textContent = '🥊';
            updateHealth();
        }

        // Controles do Teclado
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;

            switch(e.key.toLowerCase()) {
                // Jogador 1 (Azul)
                case 'a': attack(1, 22); break;           // Soco
                case 's': attack(1, 28); break;           // Chute
                case 'd': attack(1, 50, true); break;     // Uppercut
                case 'f': defend(1); break;               // Defender

                // Jogador 2 (Vermelho)
                case 'j': attack(2, 22); break;
                case 'k': attack(2, 28); break;
                case 'l': attack(2, 50, true); break;
                case ';': defend(2); break;
            }
        });

        updateHealth();
    </script>

</body>
</html>
