<!DOCTYPE html>
<!-- index.html - Calculadora de IMC com HTML, CSS e JavaScript -->

<!-- Tag raiz do documento HTML -->
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres para suportar acentos e português -->
    <meta charset="UTF-8">
    
    <!-- Configuração de visualização para dispositivos móveis (responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece na aba do navegador -->
    <title>Calculadora de IMC</title>
    
    <!-- Estilos CSS internos (inline) -->
    <style>
        /* Define a fonte e centraliza o conteúdo */
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        
        /* Estilo do título principal */
        h1 {
            text-align: center;
            color: #333;
        }
        
        /* Estilo do formulário */
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        
        /* Estilo das labels */
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }
        
        /* Estilo dos campos de entrada */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        /* Estilo do botão */
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        
        /* Efeito ao passar o mouse no botão */
        button:hover {
            background-color: #45a049;
        }
        
        /* Área onde o resultado será exibido */
        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    
    <!-- Título principal da página -->
    <h1>Calculadora de IMC</h1>
    
    <!-- Formulário de entrada de dados -->
    <form id="imcForm">
        
        <!-- Campo para digitar o peso -->
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Exemplo: 70.5" required>
        
        <!-- Campo para digitar a altura -->
        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura" step="0.01" placeholder="Exemplo: 1.75" required>
        
        <!-- Botão para calcular -->
        <button type="submit">Calcular IMC</button>
    </form>
    
    <!-- Div onde o resultado será mostrado dinamicamente -->
    <div id="resultado"></div>

    <!-- JavaScript da página -->
    <script>
        // Seleciona o formulário pelo ID
        const form = document.getElementById('imcForm');
        
        // Seleciona a div onde o resultado será exibido
        const resultadoDiv = document.getElementById('resultado');

        // Adiciona um evento de submit no formulário
        form.addEventListener('submit', function(e) {
            
            // Impede o formulário de recarregar a página
            e.preventDefault();
            
            // Pega o valor do peso e converte para número decimal
            const peso = parseFloat(document.getElementById('peso').value);
            
            // Pega o valor da altura e converte para número decimal
            const altura = parseFloat(document.getElementById('altura').value);
            
            // Validação: verifica se os campos estão preenchidos corretamente
            if (!peso || !altura || altura <= 0) {
                resultadoDiv.innerHTML = '<span style="color: red; font-weight: bold;">Por favor, insira valores válidos.</span>';
                return;
            }
            
            // Calcula o IMC
            const imc = peso / (altura * altura);
            
            // Determina a classificação do IMC
            let classificacao = '';
            if (imc < 18.5) {
                classificacao = 'Abaixo do peso';
            } else if (imc < 25) {
                classificacao = 'Peso normal';
            } else if (imc < 30) {
                classificacao = 'Sobrepeso';
            } else if (imc < 35) {
                classificacao = 'Obesidade grau I';
            } else if (imc < 40) {
                classificacao = 'Obesidade grau II';
            } else {
                classificacao = 'Obesidade grau III (mórbida)';
            }
            
            // Exibe o resultado na tela
            resultadoDiv.innerHTML = `
                <strong>Seu IMC é: ${imc.toFixed(2)}</strong><br>
                Classificação: <strong>${classificacao}</strong>
            `;
        });
    </script>
</body>
</html>
