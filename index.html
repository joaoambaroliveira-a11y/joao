<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥊 Arena de Luta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: #ff4444;
            text-shadow: 0 0 15px #ff0000;
            margin: 15px;
        }
        #arena {
            width: 820px;
            height: 420px;
            background: linear-gradient(#1a1a1a, #333);
            margin: 20px auto;
            position: relative;
            border: 10px solid #550000;
            border-radius: 15px;
            overflow: hidden;
        }
        .fighter {
            position: absolute;
            font-size: 90px;
            bottom: 60px;
            transition: all 0.15s;
        }
        #player { left: 120px; }
        #enemy { right: 120px; transform: scaleX(-1); }

        .health-bar {
            height: 30px;
            background: #222;
            width: 320px;
            margin: 10px auto;
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .health {
            height: 100%;
            background: linear-gradient(#4caf50, #8bc34a);
            width: 100%;
            transition: width 0.4s;
        }
        #enemy-health-bar .health {
            background: linear-gradient(#f44336, #ff5722);
        }

        #controls {
            margin: 20px;
        }
        button {
            padding: 15px 22px;
            margin: 6px;
            font-size: 18px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #e53935; transform: scale(1.05); }

        #message {
            font-size: 45px;
            margin: 20px;
            font-weight: bold;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <h1>🥊 ARENA DE LUTA 🥊</h1>

    <div class="health-bar">
        <div class="health" id="player-health"></div>
        <strong>JOGADOR</strong>
    </div>

    <div id="arena">
        <div id="player" class="fighter">🥊</div>
        <div id="enemy" class="fighter">🥊</div>
    </div>

    <div class="health-bar" id="enemy-health-bar">
        <div class="health" id="enemy-health"></div>
        <strong>INIMIGO</strong>
    </div>

    <div id="controls">
        <button onclick="punch()">👊 Soco Forte</button>
        <button onclick="kick()">🦵 Chute Alto</button>
        <button onclick="special()">🔥 Especial</button>
        <button onclick="defend()">🛡️ Defender</button>
        <button onclick="resetGame()">🔄 Novo Combate</button>
    </div>

    <div id="message"></div>

    <script>
        let playerHP = 100;
        let enemyHP = 100;
        let gameOver = false;
        let defending = false;

        const playerHealthEl = document.getElementById('player-health');
        const enemyHealthEl = document.getElementById('enemy-health');
        const messageEl = document.getElementById('message');
        const player = document.getElementById('player');
        const enemy = document.getElementById('enemy');

        function updateHealth() {
            playerHealthEl.style.width = playerHP + '%';
            enemyHealthEl.style.width = enemyHP + '%';
        }

        function punch() {
            if (gameOver) return;
            const damage = 22;
            enemyHP -= damage;
            if (enemyHP < 0) enemyHP = 0;

            player.style.transform = 'translateX(70px)';
            setTimeout(() => player.style.transform = 'translateX(0)', 180);

            updateHealth();
            checkWin();
            if (!gameOver) setTimeout(enemyTurn, 600);
        }

        function kick() {
            if (gameOver) return;
            const damage = 28;
            enemyHP -= damage;
            if (enemyHP < 0) enemyHP = 0;

            player.style.transform = 'translateX(60px)';
            setTimeout(() => player.style.transform = 'translateX(0)', 250);

            updateHealth();
            checkWin();
            if (!gameOver) setTimeout(enemyTurn, 700);
        }

        function special() {
            if (gameOver) return;
            const damage = 48;
            enemyHP -= damage;
            if (enemyHP < 0) enemyHP = 0;

            player.textContent = '💥';
            setTimeout(() => player.textContent = '🥊', 500);

            updateHealth();
            checkWin();
            if (!gameOver) setTimeout(enemyTurn, 800);
        }

        function defend() {
            if (gameOver) return;
            defending = true;
            player.textContent = '🛡️';
            messageEl.textContent = "Defendendo...";
            
            setTimeout(() => {
                defending = false;
                player.textContent = '🥊';
                messageEl.textContent = "";
            }, 1200);
        }

        function enemyTurn() {
            if (gameOver || playerHP <= 0) return;

            const rand = Math.random();
            let damage = 18;

            if (rand < 0.4) {
                // Soco inimigo
                damage = 20;
            } else if (rand < 0.7) {
                // Chute inimigo
                damage = 26;
            } else {
                // Especial inimigo
                damage = 35;
            }

            if (defending) {
                damage = Math.floor(damage * 0.4);
                messageEl.textContent = "Defesa boa!";
            }

            playerHP -= damage;
            if (playerHP < 0) playerHP = 0;

            enemy.style.transform = 'translateX(-70px)';
            setTimeout(() => enemy.style.transform = 'translateX(0)', 300);

            updateHealth();
            checkWin();
        }

        function checkWin() {
            if (playerHP <= 0) {
                gameOver = true;
                messageEl.innerHTML = "💀 Você Perdeu...";
                messageEl.style.color = "#ff4444";
            } else if (enemyHP <= 0) {
                gameOver = true;
                messageEl.innerHTML = "🏆 VITÓRIA!";
                messageEl.style.color = "#4caf50";
            }
        }

        function resetGame() {
            playerHP = 100;
            enemyHP = 100;
            gameOver = false;
            defending = false;
            messageEl.innerHTML = '';
            player.textContent = '🥊';
            enemy.textContent = '🥊';
            updateHealth();
        }

        // Iniciar
        updateHealth();
    </script>

</body>
</html>
