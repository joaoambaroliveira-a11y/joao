<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Luta Arcade</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #instrucoes {
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            line-height: 1.5;
        }

        #arena {
            position: relative;
            width: 800px;
            height: 400px;
        }

        /* Interface das Barras de Vida */
        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }

        .barra-container {
            width: 320px;
            height: 25px;
            background-color: #444;
            border: 2px solid #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .barra-vida {
            height: 100%;
            background-color: #ff3333;
            width: 100%;
            transition: width 0.1s ease-out;
        }

        #vida-p2 {
            float: right;
        }

        /* Tela de Jogo (Canvas) */
        canvas {
            background: linear-gradient(to bottom, #2c3e50, #0f171e);
            border: 3px solid #fff;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Tela de Fim de Jogo */
        #fim-jogo {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #fff;
        }

        #fim-jogo h1 {
            margin: 0 0 15px 0;
            font-size: 32px;
            color: #f1c40f;
        }

        #btn-reiniciar {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #fff;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #btn-reiniciar:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <div id="instrucoes">
        <strong>Jogador 1 (Azul):</strong> Teclas <b>A / D</b> movem | <b>ESPAÇO</b> ataca<br>
        <strong>Jogador 2 (Vermelho):</strong> <b>Setas (Esq / Dir)</b> movem | <b>ENTER</b> ataca
    </div>

    <div id="arena">
        <div class="hud">
            <div>
                <div style="margin-bottom: 5px;">JOGADOR 1</div>
                <div class="barra-container"><div id="vida-p1" class="barra-vida"></div></div>
            </div>
            <div style="text-align: right;">
                <div style="margin-bottom: 5px;">JOGADOR 2</div>
                <div class="barra-container"><div id="vida-p2" class="barra-vida"></div></div>
            </div>
        </div>
        
        <div id="fim-jogo">
            <h1 id="resultado"></h1>
            <button id="btn-reiniciar" onclick="reiniciar()">Jogar de Novo</button>
        </div>

        <canvas id="telaLuta" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('telaLuta');
        const ctx = canvas.getContext('2d');

        const gravidade = 0.6;
        let partidaAtiva = true;

        class Personagem {
            constructor({ x, cor, direcaoAtaque }) {
                this.posicao = { x: x, y: 0 };
                this.velocidade = { x: 0, y: 0 };
                this.largura = 50;
                this.altura = 110;
                this.cor = cor;
                this.vida = 100;
                this.estaAtacando = false;
                
                // Área do golpe (Ataque)
                this.alcanceAtaque = {
                    posicao: { x: this.posicao.x, y: this.posicao.y },
                    offset: direcaoAtaque,
                    largura: 90,
                    altura: 40
                };
            }

            desenhar() {
                // Corpo do personagem
                ctx.fillStyle = this.cor;
                ctx.fillRect(this.posicao.x, this.posicao.y, this.largura, this.altura);

                // Efeito visual do golpe
                if (this.estaAtacando) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(
                        this.alcanceAtaque.posicao.x,
                        this.alcanceAtaque.posicao.y,
                        this.alcanceAtaque.largura,
                        this.alcanceAtaque
