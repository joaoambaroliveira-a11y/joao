<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantação de Milho Realista</title>
  <style>
    body {
      background-color: #e8f5e9;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #2e7d32;
      text-shadow: 1px 1px 2px #a5d6a7;
    }
    .campo {
      position: relative;
      display: inline-block;
      perspective: 1000px;
    }
    .milho {
      width: 800px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      transform: rotateX(10deg);
      transition: transform 0.5s ease;
    }
    .milho:hover {
      transform: rotateX(0deg) scale(1.05);
    }
    p {
      color: #4e342e;
      font-size: 1.1em;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Plantação de Milho em 3D Realista</h1>
  <div class="campo">
    <img src="URL_DA_IMAGEM_AQUI" alt="Plantação de milho realista" class="milho">
  </div>
  <p>Visualização realista da plantação de milho com profundidade e textura natural.</p>
</body>
</html>
