<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    height: 100vh;
    /* Cria um gradiente do preto para o azul escuro */
    background: linear-gradient(135deg, #000000 0%, #001f3f 100%);
    color: white; /* Cor do texto para dar leitura */
    font-family: sans-serif;
  }
</style>
</head>
<body>
  <h1>Fundo Azul e Preto</h1>
  <p>Este é um exemplo de gradiente usando CSS.</p>
</body>
</html>
