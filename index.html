<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌽 Colheita de Milho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e4d2b, #3a8f4e);
            color: white;
            text-align: center;
            min-height: 100vh;
        }
        
        h1 {
            padding: 20px;
            font-size: 3em;
            text-shadow: 0 0 15px #ffeb3b;
        }
        
        #hud {
            font-size: 1.5em;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }
        
        #game {
            width: 900px;
            height: 520px;
            background: #2e6b3f url('https://i.ibb.co/0qY0zqY/farm-background.jpg') center/cover;
            margin: 20px auto;
            position: relative;
            border: 12px solid #1e4a2b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .corn {
            position: absolute;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        
        .corn:hover { transform: scale(1.3); }
        .corn.ready { animation: shake 0.6s infinite alternate; }
        
        @keyframes shake {
            from { transform: rotate(-8deg); }
            to { transform: rotate(8deg); }
        }

        /* Modal de Venda */
        #sell-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #modal-content {
            background: #1e4a2b;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 6px solid #f4a261;
            max-width: 400px;
        }
        
        #modal-content img {
            width: 180px;
            margin: 15px 0;
        }
        
        button {
            padding: 14px 24px;
            margin: 10px;
            font-size: 1.1em;
            background: #f4a261;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        button:hover {
            background: #e76f51;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>🌽 Colheita de Milho 🌽</h1>
    
    <div id="hud">
        <div>Milhos Colhidos: <strong id="score">0</strong></div>
        <div>Dinheiro: <strong>R$ <span id="money">0</span></strong></div>
        <div>Velocidade: <strong id="level">1</strong></div>
    </div>

    <div id="game"></div>

    <div>
        <button onclick="plantAll()">🌱 Plantar Todos</button>
        <button onclick="sellAll()">💰 Vender Todos</button>
        <button onclick="upgradeSpeed()">⚡ Melhorar Velocidade (R$ 80)</button>
    </div>

    <!-- Modal de Venda -->
    <div id="sell-modal">
        <div id="modal-content">
            <h2>💰 Venda Realizada!</h2>
            <img src="https://i.ibb.co/7tL7v3K/corn-sale.png" alt="Milho Vendido">
            <p id="sell-text" style="font-size: 1.4em; margin: 15px 0;"></p>
            <button onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script>
        let score = 0;
        let money = 120;
        let growthSpeed = 3200;
        let level = 1;

        const game = document.getElementById('game');
        const scoreEl = document.getElementById('score');
        const moneyEl = document.getElementById('money');
        const levelEl = document.getElementById('level');
        const modal = document.getElementById('sell-modal');
        const sellText = document.getElementById('sell-text');

        function createCorn() {
            game.innerHTML = '';
            for (let i = 0; i < 22; i++) {
                const corn = document.createElement('div');
                corn.className = 'corn';
                corn.textContent = '🌱';
                corn.style.left = Math.random() * 88 + '%';
                corn.style.top = Math.random() * 80 + '%';
                corn.dataset.stage = '0';
                
                corn.addEventListener('click', () => harvest(corn));
                game.appendChild(corn);
                startGrowing(corn);
            }
        }

        function startGrowing(corn) {
            setTimeout(() => {
                if (corn.dataset.stage === '0') {
                    corn.textContent = '🌿';
                    corn.dataset.stage = '1';
                }
            }, growthSpeed * 0.55);

            setTimeout(() => {
                if (corn.dataset.stage === '1') {
                    corn.textContent = '🌽';
                    corn.dataset.stage = '2';
                    corn.classList.add('ready');
                }
            }, growthSpeed);
        }

        function harvest(corn) {
            if (corn.dataset.stage === '2') {
                score++;
                money += 22;
                scoreEl.textContent = score;
                moneyEl.textContent = money;

                corn.style.transform = 'scale(0)';
                setTimeout(() => {
                    corn.textContent = '🌱';
                    corn.style.transform = 'scale(1)';
                    corn.dataset.stage = '0';
                    corn.classList.remove('ready');
                    startGrowing(corn);
                }, 350);
            }
        }

        function plantAll() {
            document.querySelectorAll('.corn').forEach(corn => {
                if (corn.dataset.stage === '0') startGrowing(corn);
            });
        }

        function sellAll() {
            if (score > 0) {
                const total = score * 22;
                money += total;
                moneyEl.textContent = money;

                // Mostra o modal com imagem
                sellText.innerHTML = `Você vendeu <strong>${score}</strong> milhos<br>e ganhou <strong>R$ ${total}</strong>!`;
                modal.style.display = 'flex';

                score = 0;
                scoreEl.textContent = score;
            } else {
                alert("Você não tem milhos para vender!");
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function upgradeSpeed() {
            if (money >= 80) {
                money -= 80;
                moneyEl.textContent = money;
                growthSpeed = Math.max(900, growthSpeed - 550);
                level++;
                levelEl.textContent = level;
                alert('🚀 Velocidade de crescimento aumentada!');
            } else {
                alert('Dinheiro insuficiente!');
            }
        }

        // Iniciar jogo
        window.onload = createCorn;
    </script>

</body>
</html>
