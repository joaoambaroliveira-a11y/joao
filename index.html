<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌽 Colheita de Milho - Plantar & Colher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e4d2b, #3a8f4e);
            color: white;
            text-align: center;
            min-height: 100vh;
        }
        
        h1 { padding: 20px; font-size: 2.8em; text-shadow: 0 0 15px #ffeb3b; }
        
        #hud {
            font-size: 1.4em;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        
        #game {
            width: 900px;
            height: 520px;
            background: #2e6b3f;
            margin: 20px auto;
            position: relative;
            border: 12px solid #1e4a2b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .plot {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.1);
            border: 3px dashed #ddd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .plot:hover { background: rgba(255,255,255,0.2); transform: scale(1.08); }
        .plot.planted { border-style: solid; background: rgba(46, 107, 63, 0.6); }
        .plot.ready { animation: shake 0.6s infinite alternate; }
        
        @keyframes shake {
            from { transform: rotate(-8deg); }
            to { transform: rotate(8deg); }
        }
        
        button {
            padding: 14px 24px;
            margin: 10px;
            font-size: 1.1em;
            background: #f4a261;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        button:hover { background: #e76f51; }
    </style>
</head>
<body>

    <h1>🌽 Colheita de Milho 🌽</h1>
    
    <div id="hud">
        <div>Milhos: <strong id="score">0</strong></div>
        <div>Dinheiro: <strong>R$ <span id="money">50</span></strong></div>
        <div>Sementes: <strong id="seeds">15</strong></div>
    </div>

    <div id="game"></div>

    <div>
        <button onclick="buySeeds()">🌱 Comprar Sementes (R$ 20)</button>
        <button onclick="resetGame()">🔄 Reiniciar Jogo</button>
    </div>

    <script>
        let score = 0;
        let money = 50;
        let seeds = 15;
        let growthSpeed = 2800;

        const game = document.getElementById('game');
        const scoreEl = document.getElementById('score');
        const moneyEl = document.getElementById('money');
        const seedsEl = document.getElementById('seeds');

        function createPlots() {
            game.innerHTML = '';
            
            for (let i = 0; i < 18; i++) {
                const plot = document.createElement('div');
                plot.className = 'plot';
                plot.style.left = Math.random() * 82 + '%';
                plot.style.top = Math.random() * 78 + '%';
                plot.dataset.stage = '0'; // 0 = vazio, 1 = plantado, 2 = pronto
                
                plot.addEventListener('click', () => handlePlotClick(plot));
                game.appendChild(plot);
            }
        }

        function handlePlotClick(plot) {
            const stage = parseInt(plot.dataset.stage);
            
            if (stage === 0 && seeds > 0) {
                // Plantar
                plot.textContent = '🌱';
                plot.classList.add('planted');
                plot.dataset.stage = '1';
                seeds--;
                seedsEl.textContent = seeds;
                startGrowing(plot);
                
            } else if (stage === 2) {
                // Colher
                score++;
                money += 25;
                scoreEl.textContent = score;
                moneyEl.textContent = money;
                
                plot.style.transform = 'scale(0)';
                
                setTimeout(() => {
                    plot.textContent = '';
                    plot.classList.remove('planted', 'ready');
                    plot.dataset.stage = '0';
                    plot.style.transform = 'scale(1)';
                }, 300);
            }
        }

        function startGrowing(plot) {
            setTimeout(() => {
                if (plot.dataset.stage === '1') {
                    plot.textContent = '🌿';
                }
            }, growthSpeed * 0.6);

            setTimeout(() => {
                if (plot.dataset.stage === '1') {
                    plot.textContent = '🌽';
                    plot.dataset.stage = '2';
                    plot.classList.add('ready');
                }
            }, growthSpeed);
        }

        function buySeeds() {
            if (money >= 20) {
                money -= 20;
                seeds += 8;
                moneyEl.textContent = money;
                seedsEl.textContent = seeds;
            } else {
                alert("Você não tem dinheiro suficiente!");
            }
        }

        function resetGame() {
            if (confirm("Reiniciar o jogo?")) {
                score = 0;
                money = 50;
                seeds = 15;
                scoreEl.textContent = score;
                moneyEl.textContent = money;
                seedsEl.textContent = seeds;
                createPlots();
            }
        }

        // Iniciar o jogo
        window.onload = createPlots;
    </script>

</body>
</html>
