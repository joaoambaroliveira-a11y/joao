<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Neon Azul e Preto</title>
    <style>
        /* Reset de estilos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            /* Fundo preto profundo com um destaque neon azul no centro */
            background-color: #000000;
            background-image: radial-gradient(circle at center, #001d3d 0%, #000000 70%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        /* Menu com transparência */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 25px 8%;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #00d4ff33;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff; /* Brilho neon no logo */
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00d4ff;
        }

        /* Conteúdo Principal */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: white;
            /* Texto com sombra neon azul */
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #0051ff;
        }

        p {
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        /* O BOTÃO NEON COM LINK */
        .link-botao {
            text-decoration: none;
        }

        .btn-neon {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.4s;
            /* Brilho externo do botão */
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .btn-neon:hover {
            background: #00d4ff;
            color: #000;
            /* Aumento do brilho no hover */
            box-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">PORTAL NEON</div>
        <div>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </div>
    </nav>

    <div class="container">
        <h1>DESTAQUE AZUL</h1>
        <p>A união perfeita entre a escuridão e a luz neon.</p>

        <a href="https://www.google.com.br" target="_blank" class="link-botao">
            <button class="btn-neon">Começar Agora</button>
        </a>
    </div>

</body>
</html>
