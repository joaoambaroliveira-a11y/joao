<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Fazendinha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #c8f7c5;
    }
    #fazenda {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      margin-top: 20px;
    }
    #campo {
      display: grid;
      grid-template-columns: repeat(5, 80px);
      grid-gap: 10px;
    }
    .terra {
      width: 80px;
      height: 80px;
      background-color: #8B4513;
      border: 2px solid #333;
      cursor: pointer;
    }
    .plantado {
      background-color: green;
    }
    .colhido {
      background-color: yellow;
    }
    /* Casa */
    #casa {
      width: 120px;
      height: 120px;
      position: relative;
    }
    .parede {
      width: 100%;
      height: 80px;
      background-color: #ffcc66;
      border: 2px solid #333;
    }
    .telhado {
      width: 0;
      height: 0;
      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 40px solid #b22222;
      position: absolute;
      top: -40px;
      left: 0;
    }
    .porta {
      width: 30px;
      height: 40px;
      background-color: #654321;
      border: 2px solid #333;
      position: absolute;
      bottom: 0;
      left: 45px;
    }
  </style>
</head>
<body>
  <h1>🌾 Jogo de Fazendinha 🌾</h1>
  <p>Clique na terra para plantar. Clique novamente para colher!</p>
  <div id="fazenda">
    <div id="campo"></div>
    <div id="casa">
      <div class="telhado"></div>
      <div class="parede"></div>
      <div class="porta"></div>
    </div>
  </div>
  <p>Pontos: <span id="pontos">0</span></p>

  <script>
    const campo = document.getElementById("campo");
    const pontosEl = document.getElementById("pontos");
    let pontos = 0;

    // Criar 25 pedaços de terra
    for (let i = 0; i < 25; i++) {
      const terra = document.createElement("div");
      terra.classList.add("terra");
      terra.addEventListener("click", () => {
        if (!terra.classList.contains("plantado")) {
          terra.classList.add("plantado");
        } else if (terra.classList.contains("plantado")) {
          terra.classList.remove("plantado");
          terra.classList.add("colhido");
          pontos += 10;
          pontosEl.textContent = pontos;
        } else if (terra.classList.contains("colhido")) {
          terra.classList.remove("colhido");
        }
      });
      campo.appendChild(terra);
    }
  </script>
</body>
</html>
